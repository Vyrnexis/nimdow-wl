name: Tests
on:
  pull_request:
  push:
    branches:
    - '**'
jobs:
  linux:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git nim nimble wayland libxkbcommon \
            cairo pango librsvg systemd-libs glib2 harfbuzz gdk-pixbuf2 pkgconf gcc
      - uses: actions/checkout@v5
      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          nimble install -d -y
          nimble build -y
      - name: Unit tests
        run: |
          nimble install -y nimtest
          export PATH="$HOME/.nimble/bin:$PATH"
          nimtest
