# App Rules
# Example:
# [[appRule]]
# class = "foot"   # class and instance are both matched against the window's app_id
# instance = "foot"
# title = "foot"
# monitor = 1
# tags = [ 1, 4, 7 ]
# state = "floating" # normal, floating, and fullscreen are all valid.

# Start external programs. The optional description is what the key bindings
# overlay (super+/) shows; without it the command is shown.
[[startProcess]]
command = "$BROWSER"
# description = "Browser"
keys = [ "i" ]
modifiers = [ "super" ]

# Application launcher, any Wayland launcher works (fuzzel, wofi, tofi, ...).
[[startProcess]]
command = "fuzzel"
keys = [ "p" ]
modifiers = [ "super" ]

# Terminal
[[startProcess]]
command = "alacritty"
keys = [ "Return" ]
modifiers = [ "super" ]

# Example: Start process when region is clicked, see github wiki for what constitutes a region
# [[startProcess]]
# command = "notify-send \"Id: %1, rx: %2, cx: %4, cy: %5, w: %6, b: %7\""
# clickRegion = 0

# Example: a key that keeps working while the session is locked (see lockSession).
# [[startProcess]]
# command = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
# keys = [ "XF86AudioMute" ]
# modifiers = []
# whileLocked = true

# The status text on the bar is set with `nimdow-wl --status "text"`, e.g. from a script:
#   while true; do nimdow-wl --status "$(date +%H:%M)"; sleep 30; done
[autostart]
exec = [
  #"firefox",
  #"alacritty",
  #"while true; do nimdow-wl --status \"$(date +%H:%M)\"; sleep 30; done",
]

[settings]
  # Window settings
  borderWidth = 1
  borderColorUnfocused = "#282a36"
  borderColorFocused = "#50fa7b"
  borderColorUrgent = "#ff5555"
  # Bar settings
  barHeight = 20
  # System tray (StatusNotifierItem, see README). Icon size is barHeight - 2 * trayIconPadding.
  trayEnabled = true
  trayMonitor = 1 # 1 = the first monitor's bar, 2 = the second, ...; 0 = follow the selected monitor
  trayIconPadding = 2
  trayIconSpacing = 4
  #trayIconTheme = "Adwaita" # default: gtk-icon-theme-name from ~/.config/gtk-{3,4}.0/settings.ini, else Adwaita
  windowTitlePosition = "center"
  barBackgroundColor = "#282a36"
  barForegroundColor = "#f8f8f2"
  barSelectionColor = "#50fa7b"
  #menuBorderColor = "#50fa7b" # tray context menus; default: barSelectionColor
  #menuWidthMin = 150
  barUrgentColor = "#ff5555"
  barHasWindowsColor = "#f5e0dc"
  barShowIndicator = false
  #barTagPadding = 8 # space on each side of a tag label
  barTransparency = 255 # 0 to 255
  barFonts = [
    "monospace:size=10:antialias=true",
    "NotoColorEmoji:size=10:antialias=true"
  ]
  # Layout settings
  gapSize = 12
  outerGap = 0
  resizeStep = 10
  # Floating windows: size (% of the usable area) of a tiled window made floating,
  # and pixels per keyboard move/resize step
  floatingWidth = 50
  floatingHeight = 50
  floatingStep = 40
  # Scratchpad settings
  scratchpadWidth = 500
  scratchpadHeight = 300
  # General settings
  lockCommand = "swaylock -f -c 282828"
  # Show the key bindings overlay (super+/) when nimdow-wl starts.
  hotkeyOverlayAtStartup = false
  loggingEnabled = false
  reverseTagScrolling = false
  # The key used for moving and resizing windows.
  # All options: "control", "shift", "alt", "super", "caps lock", "mod1", "mod2", "mod3", "mod4", "mod5"
  # alt is an alias for Mod1Mask,
  # super is an alias for Mod4Mask
  # See config/keys.nim for details
  modKey = "super"

# Input devices. Every key is optional: a key that is not set leaves the compositor's
# or libinput's default alone, so without this section nothing changes.
# Invalid values are logged and ignored. Settings apply at startup, when a device is
# plugged in and on config reload; a key removed later keeps its value until River
# restarts (or the device is replugged).
# Needs River 0.5 (river_input_manager_v1, river_xkb_config_v1, river_libinput_config_v1).

[input.keyboard]
  # The xkb keymap is built from layout, variant, options and model (as in setxkbmap -rules evdev).
  # It is built when at least one of these four is set; the others use xkbcommon's defaults.
  #layout = "us"               # one or more layouts, e.g. "us,de"
  #variant = ""                # one per layout, e.g. "dvorak," (empty entries: the layout's default)
  #options = ""                # e.g. "caps:escape,grp:alt_shift_toggle"
  #model = ""                  # e.g. "pc105"
  # Key repeat. If only one is set, the other one is River's default (25 and 600).
  #repeatRate = 25             # keys per second, 0 turns repeating off
  #repeatDelay = 600           # milliseconds before the repeat starts
  #numlock = true              # num lock state on all keyboards (also after a keymap change)

# Touchpads: libinput devices that support tap-to-click. A setting is only sent when the
# device reports that it supports it.
[input.touchpad]
  #tap = true                  # tap to click
  #naturalScroll = false       # content follows the fingers
  #disableWhileTyping = true   # ignore the touchpad while typing
  #accelSpeed = 0.0            # -1.0 (slowest) to 1.0 (fastest)
  #accelProfile = "adaptive"   # adaptive | flat
  #clickMethod = "clickfinger" # clickfinger (1/2/3 fingers = left/right/middle) | buttonareas
  #scrollMethod = "twofinger"  # twofinger | edge | none

# Mice: the other libinput pointer devices.
[input.mouse]
  #naturalScroll = false
  #accelSpeed = 0.0            # -1.0 to 1.0
  #accelProfile = "flat"       # adaptive | flat
  #leftHanded = false          # swap the left and right buttons

# Window manager controls
[controls]
  [controls.reloadConfig]
  keys = [ "r" ]
  modifiers = [ "super", "shift" ]

  [controls.focusPrevious]
  keys = [ "k" ]
  modifiers = [ "super" ]

  [controls.focusNext]
  keys = [ "j" ]
  modifiers = [ "super" ]

  [controls.moveWindowPrevious]
  keys = [ "k" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowNext]
  keys = [ "j" ]
  modifiers = [ "super", "shift" ]

  [controls.toggleFullscreen]
  keys = [ "f" ]
  modifiers = [ "super" ]

  [controls.destroySelectedWindow]
  keys = [ "q" ]
  modifiers = [ "super", "shift" ]

  [controls.goToPreviousTag]
  keys = [ "w" ]
  modifiers = [ "super" ]

  [controls.moveWindowToPreviousTag]
  keys = [ "w" ]
  modifiers = [ "super", "shift" ]

  [controls.focusPreviousMonitor]
  keys = [ "comma" ]
  modifiers = [ "super" ]

  [controls.focusNextMonitor]
  keys = [ "period" ]
  modifiers = [ "super" ]

  [controls.moveWindowToPreviousMonitor]
  keys = [ "comma" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowToNextMonitor]
  keys = [ "period" ]
  modifiers = [ "super", "shift" ]

  [controls.increaseMasterCount]
  keys = [ "z" ]
  modifiers = [ "super" ]

  [controls.decreaseMasterCount]
  keys = [ "x" ]
  modifiers = [ "super" ]

  [controls.toggleFloating]
  keys = [ "space" ]
  modifiers = [ "super" ]

  [controls.moveFloatingLeft]
  keys = [ "h" ]
  modifiers = [ "super", "control" ]

  [controls.moveFloatingDown]
  keys = [ "j" ]
  modifiers = [ "super", "control" ]

  [controls.moveFloatingUp]
  keys = [ "k" ]
  modifiers = [ "super", "control" ]

  [controls.moveFloatingRight]
  keys = [ "l" ]
  modifiers = [ "super", "control" ]

  [controls.resizeFloatingNarrower]
  keys = [ "h" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.resizeFloatingTaller]
  keys = [ "j" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.resizeFloatingShorter]
  keys = [ "k" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.resizeFloatingWider]
  keys = [ "l" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.centerFloating]
  keys = [ "c" ]
  modifiers = [ "super" ]

  [controls.jumpToUrgentWindow]
  keys = [ "u" ]
  modifiers = [ "super" ]

  [controls.goToTag]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super" ]

  [controls.goToLeftTag]
  keys = [ "Left" ]
  modifiers = [ "super" ]

  [controls.goToRightTag]
  keys = [ "Right" ]
  modifiers = [ "super" ]

  [controls.moveWindowToTag]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowToLeftTag]
  keys = [ "Left" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowToRightTag]
  keys = [ "Right" ]
  modifiers = [ "super", "shift" ]

  [controls.toggleTagView]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super", "control" ]

  [controls.toggleWindowTag]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super", "shift", "control" ]

	[controls.increaseMasterWidth]
	keys = [ "l" ]
	modifiers = [ "super" ]

	[controls.decreaseMasterWidth]
	keys = [ "h" ]
	modifiers = [ "super" ]

  [controls.moveWindowToScratchpad]
  keys = [ "s" ]
  modifiers = [ "super", "shift" ]

  [controls.popScratchpad]
  keys = [ "s" ]
  modifiers = [ "super" ]

  [controls.rotateClients]
  keys = [ "r" ]
  modifiers = [ "super" ]

  [controls.toggleHotkeyOverlay]
  # Lists all key bindings; Escape, a click or this key closes the list.
  keys = [ "slash" ]
  modifiers = [ "super" ]

  [controls.lockSession]
  # Runs lockCommand. While the session is locked all bindings are off, except
  # startProcess entries with whileLocked = true.
  keys = [ "Escape" ]
  modifiers = [ "super" ]

  [controls.exitSession]
  # Exits River (and nimdow-wl). Killing nimdow-wl alone leaves River running.
  keys = [ "Delete" ]
  modifiers = [ "control", "alt" ]

  [controls.toggleStatusBar]
  keys = [ "b" ]
  modifiers = [ "super" ]

