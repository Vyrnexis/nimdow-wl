# nimdow-wl desktop defaults (installed to /etc/xdg/nimdow-wl/config.toml and copied to
# ~/.config/nimdow-wl/config.toml on first login; edit that copy, then press super+shift+r to reload).

# App Rules
# class and instance are both matched against the window's app_id. Optional keys:
# instance, monitor = 1, tags = [ 1, 4, 7 ], state = "normal" | "floating" | "fullscreen".
[[appRule]]
class = "nimlaunch"
title = "nimlaunch"
# monitor = 1
# tags = [ 1, 4, 7 ]
state = "floating"

# Start external programs
[[startProcess]]
command = "firefox"
description = "Browser"
keys = [ "i" ]
modifiers = [ "super" ]

# Application launcher, any Wayland launcher works (fuzzel, wofi, tofi, ...).
[[startProcess]]
command = "nimlaunch"
description = "Application launcher"
keys = [ "d" ]
modifiers = [ "super" ]

# Terminal
[[startProcess]]
command = "kitty"
description = "Terminal"
keys = [ "Return" ]
modifiers = [ "super" ]

# --- Media, brightness and screenshot keys (no modifiers) ---
# whileLocked = true keeps a key working on the lock screen.
[[startProcess]]
command = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+"
description = "Volume up"
keys = [ "XF86AudioRaiseVolume" ]
modifiers = []
whileLocked = true

[[startProcess]]
command = "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-"
description = "Volume down"
keys = [ "XF86AudioLowerVolume" ]
modifiers = []
whileLocked = true

[[startProcess]]
command = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
description = "Mute"
keys = [ "XF86AudioMute" ]
modifiers = []
whileLocked = true

[[startProcess]]
command = "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
description = "Mute microphone"
keys = [ "XF86AudioMicMute" ]
modifiers = []
whileLocked = true

[[startProcess]]
command = "brightnessctl set 5%+"
description = "Brightness up"
keys = [ "XF86MonBrightnessUp" ]
modifiers = []
whileLocked = true

[[startProcess]]
command = "brightnessctl set 5%-"
description = "Brightness down"
keys = [ "XF86MonBrightnessDown" ]
modifiers = []
whileLocked = true

# Select a region and copy the screenshot to the clipboard
[[startProcess]]
command = "sh -c 'grim -g \"$(slurp)\" - | wl-copy'"
description = "Screenshot region to clipboard"
keys = [ "Print" ]
modifiers = []

# --- nimdow-wl-status click regions (%7 = button: 1 left, 3 right, 4/5 scroll) ---
# Regions follow the segment order in ~/.config/nimdow-wl/status.toml: 1 updates, 2 weather, 3 memory,
# 4 volume, 5 battery, 6 date/time, 7 network (region 0 is the window title).
[[startProcess]]
command = "kitty --title 'Arch updates' -e sh -c 'if command -v paru >/dev/null; then paru -Syu; elif command -v yay >/dev/null; then yay -Syu; else sudo pacman -Syu; fi; echo; printf \"Press Enter to close\"; read _'"
clickRegion = 1

[[startProcess]]
command = "kitty --title Weather -e sh -c 'curl -s wttr.in; printf \"Press Enter to close\"; read _'"
clickRegion = 2

[[startProcess]]
command = "sh -c 'case %7 in 4) wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+ ;; 5) wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%- ;; 1) wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle ;; 3) pavucontrol ;; esac'"
clickRegion = 4

[[startProcess]]
command = "kitty --title Network -e nmtui"
clickRegion = 7

# The bar text is provided by nimdow-wl-status (it calls `nimdow-wl --status`).
# Wallpaper: "Reverie" (/usr/share/backgrounds/nimdow-wl/reverie.jpg)
# (use any image with swaybg -i; a solid colour only: swaybg -c '#282828')
[autostart]
exec = [
  "swaybg -i /usr/share/backgrounds/nimdow-wl/reverie.jpg -m fill -c '#282828'",
  "mako",
  "/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1",
  "nimdow-wl-status",
  "swayidle -w timeout 600 'swaylock -f -c 282828' timeout 900 'systemctl suspend' before-sleep 'swaylock -f -c 282828'",
]

# Theme: Gruvbox Dark (matches kitty / noctalia). Fonts: MesloLGS Nerd Font.
[settings]
  # List the key bindings when nimdow-wl starts (super+/ shows them again).
  hotkeyOverlayAtStartup = true
  # Window settings
  borderWidth = 2
  borderColorUnfocused = "#3c3836"
  borderColorFocused = "#b8bb26"
  borderColorUrgent = "#fb4934"
  # Bar settings
  barHeight = 30
  # System tray (StatusNotifierItem, see README). Icon size is barHeight - 2 * trayIconPadding.
  trayEnabled = true
  trayMonitor = 1 # 1 = the first monitor's bar, 2 = the second, ...; 0 = follow the selected monitor
  trayIconPadding = 4
  trayIconSpacing = 6
  #trayIconTheme = "Adwaita" # default: gtk-icon-theme-name from ~/.config/gtk-{3,4}.0/settings.ini, else Adwaita
  windowTitlePosition = "center"
  barBackgroundColor = "#282828"
  barForegroundColor = "#ebdbb2"
  barSelectionColor = "#fabd2f"
  menuBorderColor = "#b8bb26"
  menuWidthMin = 180
  barUrgentColor = "#fb4934"
  barHasWindowsColor = "#83a598"
  barShowIndicator = true
  barTagPadding = 12 # space on each side of a tag label
  barTransparency = 255 # 0 to 255
  # ttf-meslo-nerd provides the nerd-font icons.
  barFonts = [
    "MesloLGS Nerd Font:size=12:antialias=true",
    "NotoColorEmoji:size=12:antialias=true"
  ]
  # Layout settings
  gapSize = 8
  outerGap = 0
  resizeStep = 10
  # Floating windows: size (% of the usable area) of a tiled window made floating,
  # and pixels per keyboard move/resize step
  floatingWidth = 50
  floatingHeight = 50
  floatingStep = 40
  # Scratchpad settings
  scratchpadWidth = 500
  scratchpadHeight = 300
  # General settings
  loggingEnabled = false
  reverseTagScrolling = false
  # The key used for moving and resizing windows.
  # All options: "control", "shift", "alt", "super", "caps lock", "mod1", "mod2", "mod3", "mod4", "mod5"
  # alt is an alias for Mod1Mask,
  # super is an alias for Mod4Mask
  # See config/keys.nim for details
  modKey = "super"

# Input devices. Every key is optional: a key that is not set leaves the compositor's
# or libinput's default alone, so without this section nothing changes.
# Invalid values are logged and ignored. Settings apply at startup, when a device is
# plugged in and on config reload; a key removed later keeps its value until River
# restarts (or the device is replugged).
# Needs River 0.5 (river_input_manager_v1, river_xkb_config_v1, river_libinput_config_v1).

# Tap to click. More settings (all optional, see config.default.toml for the full list):
[input.keyboard]
  #layout = "us"
  #variant = ""
  #options = "caps:escape"
  #repeatRate = 25
  #repeatDelay = 600
  #numlock = true

[input.touchpad]
  tap = true
  #naturalScroll = false
  #disableWhileTyping = true
  #accelSpeed = 0.0
  #accelProfile = "adaptive"
  #clickMethod = "clickfinger"
  #scrollMethod = "twofinger"

[input.mouse]
  #naturalScroll = false
  #accelSpeed = 0.0
  #accelProfile = "flat"
  #leftHanded = false

# Window manager controls
[controls]
  [controls.reloadConfig]
  keys = [ "r" ]
  modifiers = [ "super", "shift" ]

  [controls.focusPrevious]
  keys = [ "k" ]
  modifiers = [ "super" ]

  [controls.focusNext]
  keys = [ "j" ]
  modifiers = [ "super" ]

  [controls.moveWindowPrevious]
  keys = [ "k" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowNext]
  keys = [ "j" ]
  modifiers = [ "super", "shift" ]

  [controls.toggleFullscreen]
  keys = [ "f" ]
  modifiers = [ "super" ]

  [controls.destroySelectedWindow]
  keys = [ "q" ]
  modifiers = [ "super" ]

  [controls.goToPreviousTag]
  keys = [ "w" ]
  modifiers = [ "super" ]

  [controls.moveWindowToPreviousTag]
  keys = [ "w" ]
  modifiers = [ "super", "shift" ]

  [controls.focusPreviousMonitor]
  keys = [ "comma" ]
  modifiers = [ "super" ]

  [controls.focusNextMonitor]
  keys = [ "period" ]
  modifiers = [ "super" ]

  [controls.moveWindowToPreviousMonitor]
  keys = [ "comma" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowToNextMonitor]
  keys = [ "period" ]
  modifiers = [ "super", "shift" ]

  [controls.increaseMasterCount]
  keys = [ "z" ]
  modifiers = [ "super" ]

  [controls.decreaseMasterCount]
  keys = [ "x" ]
  modifiers = [ "super" ]

  [controls.toggleFloating]
  keys = [ "space" ]
  modifiers = [ "super" ]

  [controls.moveFloatingLeft]
  keys = [ "h" ]
  modifiers = [ "super", "control" ]

  [controls.moveFloatingDown]
  keys = [ "j" ]
  modifiers = [ "super", "control" ]

  [controls.moveFloatingUp]
  keys = [ "k" ]
  modifiers = [ "super", "control" ]

  [controls.moveFloatingRight]
  keys = [ "l" ]
  modifiers = [ "super", "control" ]

  [controls.resizeFloatingNarrower]
  keys = [ "h" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.resizeFloatingTaller]
  keys = [ "j" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.resizeFloatingShorter]
  keys = [ "k" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.resizeFloatingWider]
  keys = [ "l" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.centerFloating]
  keys = [ "c" ]
  modifiers = [ "super" ]

  [controls.jumpToUrgentWindow]
  keys = [ "u" ]
  modifiers = [ "super" ]

  [controls.goToTag]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super" ]

  [controls.goToLeftTag]
  keys = [ "Left" ]
  modifiers = [ "super" ]

  [controls.goToRightTag]
  keys = [ "Right" ]
  modifiers = [ "super" ]

  [controls.moveWindowToTag]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowToLeftTag]
  keys = [ "Left" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowToRightTag]
  keys = [ "Right" ]
  modifiers = [ "super", "shift" ]

  [controls.toggleTagView]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super", "control" ]

  [controls.toggleWindowTag]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super", "shift", "control" ]

	[controls.increaseMasterWidth]
	keys = [ "l" ]
	modifiers = [ "super" ]

	[controls.decreaseMasterWidth]
	keys = [ "h" ]
	modifiers = [ "super" ]

  [controls.moveWindowToScratchpad]
  keys = [ "s" ]
  modifiers = [ "super", "shift" ]

  [controls.popScratchpad]
  keys = [ "s" ]
  modifiers = [ "super" ]

  [controls.rotateClients]
  keys = [ "r" ]
  modifiers = [ "super" ]

  [controls.toggleHotkeyOverlay]
  # Lists all key bindings.
  keys = [ "slash" ]
  modifiers = [ "super" ]

  [controls.lockSession]
  # Runs lockCommand (default: swaylock -f -c 282828).
  keys = [ "Escape" ]
  modifiers = [ "super" ]

  [controls.exitSession]
  # Exits River (and nimdow-wl). Killing nimdow-wl alone leaves River running.
  keys = [ "Delete" ]
  modifiers = [ "control", "alt" ]

  [controls.toggleStatusBar]
  keys = [ "b" ]
  modifiers = [ "super" ]

# Example monitor settings:
# [monitors]
  # [monitors.default.tags]
  # 1.displayString = "one"
  # 2.displayString = "foobar"
  # Set the number of master windows for ALL monitors.
  # all.numMasterWindows = 2
  # all.defaultMasterWidthPercentage = 60

  # [monitors.1.tags]
  # 2.displayString = "two"
  # Set the number of master windows per-monitor.
  # all.numMasterWindows = 3
  # Set the number of master windows per-tag.
  # 2.numMasterWindows = 1

  # [monitors.2.tags]
  # 2.displayString = "too"


# Tags: Nerd Font numeric boxes (nf-md-numeric_N_box)
[monitors]
  [monitors.default.tags]
  1.displayString = "󰎤"  # numeric-1-box
  2.displayString = "󰎧"  # numeric-2-box
  3.displayString = "󰎪"  # numeric-3-box
  4.displayString = "󰎭"  # numeric-4-box
  5.displayString = "󰎱"  # numeric-5-box
  6.displayString = "󰎳"  # numeric-6-box
  7.displayString = "󰎶"  # numeric-7-box
  8.displayString = "󰎹"  # numeric-8-box
  9.displayString = "󰎼"  # numeric-9-box
