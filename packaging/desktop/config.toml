  # 2.numMasterWindows = 1

  # [monitors.2.tags]
  # 2.displayString = "too"


# Tags: Nerd Font numeric boxes (nf-md-numeric_N_box)
[monitors]
  [monitors.default.tags]
  1.displayString = "󰎤"  # numeric-1-box
  2.displayString = "󰎧"  # numeric-2-box
  3.displayString = "󰎪"  # numeric-3-box
  4.displayString = "󰎭"  # numeric-4-box
  5.displayString = "󰎱"  # numeric-5-box
  6.displayString = "󰎳"  # numeric-6-box
  7.displayString = "󰎶"  # numeric-7-box
  8.displayString = "󰎹"  # numeric-8-box
  9.displayString = "󰎼"  # numeric-9-box
