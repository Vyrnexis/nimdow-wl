# App Rules
# Example:
# [[appRule]]
# class = "foot"   # matched against the window's app_id
# title = "foot"
# monitor = 1
# tags = [ 1, 4, 7 ]
# state = "floating" # normal, floating, and fullscreen are all valid.

# Start external programs
[[startProcess]]
command = "alacritty --class e2e-browser --title e2e-browser -e sleep 3600"
keys = [ "i" ]
modifiers = [ "super" ]

# Application launcher, any Wayland launcher works (fuzzel, wofi, tofi, ...).
[[startProcess]]
command = "alacritty --class e2e-launcher --title e2e-launcher -e sleep 3600"
keys = [ "p" ]
modifiers = [ "super" ]

# Terminal
[[startProcess]]
command = "alacritty --class e2e-term --title e2e-term -e sleep 3600"
keys = [ "Return" ]
modifiers = [ "super" ]

# Example: Start process when region is clicked, see github wiki for what constitutes a region
# [[startProcess]]
# command = "notify-send \"Id: %1, rx: %2, cx: %4, cy: %5, w: %6, b: %7\""
# clickRegion = 0

# The status text on the bar is set with `nimdow-wl --status "text"`, e.g. from a script:
#   while true; do nimdow-wl --status "$(date +%H:%M)"; sleep 30; done
[autostart]
exec = [
  #"firefox",
  #"alacritty",
  #"while true; do nimdow-wl --status \"$(date +%H:%M)\"; sleep 30; done",
]

[settings]
  # Deterministic tray icon lookup (see tests/e2e/fake_sni.py).
  trayIconTheme = "Adwaita"
  # Window settings
  borderWidth = 1
  borderColorUnfocused = "#282a36"
  borderColorFocused = "#50fa7b"
  borderColorUrgent = "#ff5555"
  # Bar settings
  barHeight = 20
  windowTitlePosition = "center"
  barBackgroundColor = "#282a36"
  barForegroundColor = "#f8f8f2"
  barSelectionColor = "#50fa7b"
  barUrgentColor = "#ff5555"
  barHasWindowsColor = "#f5e0dc"
  barShowIndicator = false
  barTransparency = 255 # 0 to 255
  barFonts = [
    "monospace:size=10:antialias=true"
  ]
  # Layout settings
  gapSize = 12
  outerGap = 0
  resizeStep = 10
  # Floating windows: size (% of the usable area) of a tiled window made floating,
  # and pixels per keyboard move/resize step
  floatingWidth = 50
  floatingHeight = 50
  floatingStep = 40
  # Scratchpad settings
  scratchpadWidth = 500
  scratchpadHeight = 300
  # General settings
  loggingEnabled = true
  reverseTagScrolling = false
  # The key used for moving and resizing windows.
  # All options: "control", "shift", "alt", "super", "caps lock", "mod1", "mod2", "mod3", "mod4", "mod5"
  # alt is an alias for Mod1Mask,
  # super is an alias for Mod4Mask
  # See config/keys.nim for details
  modKey = "super"

# Window manager controls
[controls]
  [controls.reloadConfig]
  keys = [ "r" ]
  modifiers = [ "super", "shift" ]

  [controls.focusPrevious]
  keys = [ "k" ]
  modifiers = [ "super" ]

  [controls.focusNext]
  keys = [ "j" ]
  modifiers = [ "super" ]

  [controls.moveWindowPrevious]
  keys = [ "k" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowNext]
  keys = [ "j" ]
  modifiers = [ "super", "shift" ]

  [controls.toggleFullscreen]
  keys = [ "f" ]
  modifiers = [ "super" ]

  [controls.destroySelectedWindow]
  keys = [ "q" ]
  modifiers = [ "super", "shift" ]

  [controls.goToPreviousTag]
  keys = [ "w" ]
  modifiers = [ "super" ]

  [controls.moveWindowToPreviousTag]
  keys = [ "w" ]
  modifiers = [ "super", "shift" ]

  [controls.focusPreviousMonitor]
  keys = [ "comma" ]
  modifiers = [ "super" ]

  [controls.focusNextMonitor]
  keys = [ "period" ]
  modifiers = [ "super" ]

  [controls.moveWindowToPreviousMonitor]
  keys = [ "comma" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowToNextMonitor]
  keys = [ "period" ]
  modifiers = [ "super", "shift" ]

  [controls.increaseMasterCount]
  keys = [ "z" ]
  modifiers = [ "super" ]

  [controls.decreaseMasterCount]
  keys = [ "x" ]
  modifiers = [ "super" ]

  [controls.toggleFloating]
  keys = [ "space" ]
  modifiers = [ "super" ]

  [controls.moveFloatingLeft]
  keys = [ "h" ]
  modifiers = [ "super", "control" ]

  [controls.moveFloatingDown]
  keys = [ "j" ]
  modifiers = [ "super", "control" ]

  [controls.moveFloatingUp]
  keys = [ "k" ]
  modifiers = [ "super", "control" ]

  [controls.moveFloatingRight]
  keys = [ "l" ]
  modifiers = [ "super", "control" ]

  [controls.resizeFloatingNarrower]
  keys = [ "h" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.resizeFloatingTaller]
  keys = [ "j" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.resizeFloatingShorter]
  keys = [ "k" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.resizeFloatingWider]
  keys = [ "l" ]
  modifiers = [ "super", "control", "shift" ]

  [controls.centerFloating]
  keys = [ "c" ]
  modifiers = [ "super" ]

  [controls.jumpToUrgentWindow]
  keys = [ "u" ]
  modifiers = [ "super" ]

  [controls.goToTag]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super" ]

  [controls.goToLeftTag]
  keys = [ "Left" ]
  modifiers = [ "super" ]

  [controls.goToRightTag]
  keys = [ "Right" ]
  modifiers = [ "super" ]

  [controls.moveWindowToTag]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowToLeftTag]
  keys = [ "Left" ]
  modifiers = [ "super", "shift" ]

  [controls.moveWindowToRightTag]
  keys = [ "Right" ]
  modifiers = [ "super", "shift" ]

  [controls.toggleTagView]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super", "control" ]

  [controls.toggleWindowTag]
  keys = [ "1", "2", "3", "4", "5", "6", "7", "8", "9" ]
  modifiers = [ "super", "shift", "control" ]

	[controls.increaseMasterWidth]
	keys = [ "l" ]
	modifiers = [ "super" ]

	[controls.decreaseMasterWidth]
	keys = [ "h" ]
	modifiers = [ "super" ]

  [controls.moveWindowToScratchpad]
  keys = [ "s" ]
  modifiers = [ "super", "shift" ]

  [controls.popScratchpad]
  keys = [ "s" ]
  modifiers = [ "super" ]

  [controls.rotateClients]
  keys = [ "r" ]
  modifiers = [ "super" ]

  [controls.exitSession]
  # Exits River (and nimdow-wl). Killing nimdow-wl alone leaves River running.
  keys = [ "Delete" ]
  modifiers = [ "control", "alt" ]

  [controls.toggleStatusBar]
  keys = [ "b" ]
  modifiers = [ "super" ]

# Example monitor settings:
# [monitors]
  # [monitors.default.tags]
  # 1.displayString = "one"
  # 2.displayString = "foobar"
  # Set the number of master windows for ALL monitors.
  # all.numMasterWindows = 2
  # all.defaultMasterWidthPercentage = 60

  # [monitors.1.tags]
  # 2.displayString = "two"
  # Set the number of master windows per-monitor.
  # all.numMasterWindows = 3
  # Set the number of master windows per-tag.
  # 2.numMasterWindows = 1

  # [monitors.2.tags]
  # 2.displayString = "too"


# --- e2e only: app rules ---
[[appRule]]
class = "e2e-float"
state = "floating"
width = 400
height = 300
x = 100
y = 100

[[appRule]]
title = "e2e-titled"
tags = [ 4 ]

[[appRule]]
class = "e2e-center"
state = "floating"
width = 450
height = 320

# The title is set shortly after the window appeared (see appRules scenario).
[[appRule]]
title = "e2e-late-title"
tags = [ 5 ]
